<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Neighborhood Explorer</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <canvas class="webgl"></canvas>

    <div id="loadingScreen">
        <h1>Neighborhood Explorer</h1>
        <p>Loading neighborhood...</p>
    </div>

    <div id="hud">

        <div class="title">
            Neighborhood Explorer
        </div>

        <div class="instructions">
            <strong>Move:</strong> WASD / Arrow Keys<br>
            <strong>Run:</strong> Shift<br>
            <strong>Look:</strong> Mouse
        </div>

    </div>

    <div id="crosshair">+</div>

    <script
        type="importmap"
    >
    {
        "imports": {
            "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

            "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

    <script
        type="module"
        src="./script.js"
    ></script>

</body>
</html>

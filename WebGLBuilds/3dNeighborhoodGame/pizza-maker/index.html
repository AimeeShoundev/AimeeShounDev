<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pizza Maker</title><link rel="stylesheet" href="style.css"></head><body><main class="game"><header><div><button type="button" id="exitShop" class="exit-shop" aria-label="Exit pizza maker and return to shop">🚪 Exit — Back to Shop</button><h1>🍕 Pizza Rush</h1><p>Build the customer's pizza!</p></div><div class="ticket" id="ticket" aria-label="Customer order ticket"></div></header><section class="play"><div class="work"><div class="stage" id="stage">PREP STATION</div><div class="pizza-wrap"><div class="pizza" id="pizza"><canvas id="paintCanvas" class="paint-canvas" aria-label="Draw sauce and cheese on pizza"></canvas><div class="toppings" id="toppings"></div><div class="crust-seasoning" id="crustSeasoning"></div></div></div><div id="deliveryBox" class="delivery-box" aria-label="Closed pizza delivery box" hidden><div class="delivery-box-lid"><div class="delivery-box-logo">🍕</div><strong>PIZZA RUSH</strong><span>HOT &amp; FRESH</span><small>READY FOR DELIVERY</small></div></div><div class="meter"><span id="meterLabel">Ready to prep</span><div class="track"><div id="meterFill"></div></div></div></div><aside><h2 id="stepTitle">1. Choose size</h2><p id="instruction">Read the ticket and select the size.</p><div class="choices" id="choices"></div><button class="next" id="next" disabled>Continue →</button><button class="restart" id="restart">New customer order</button><div class="feedback" id="feedback" aria-live="polite"></div></aside></section><footer>Mouse and touch friendly · Your mistakes count toward the final score.</footer></main><script src="script.js"></script></body></html>
